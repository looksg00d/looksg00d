name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    # Deliberately no `push` trigger — this job commits its own output, and a
    # push trigger would re-run it on that commit forever.

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- assets/*.svg)" ]; then
            echo "no changes, skipping commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/*.svg
          git commit -m "stats: refresh"
          git push
