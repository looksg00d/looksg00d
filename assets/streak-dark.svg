<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-label="looksg00d's contribution streaks">
  <title>looksg00d's contribution streaks</title>
  <style>
    
    @font-face {
      font-family: 'Stats Mono';
      font-weight: 400;
      src: url(data:font/woff2;base64,) format('woff2');
    }
    @font-face {
      font-family: 'Stats Mono';
      font-weight: 700;
      src: url(data:font/woff2;base64,) format('woff2');
    }
    text { font-family: 'Stats Mono', ui-monospace, monospace; }
    
  </style>
  <rect width="480" height="120" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <text x="24" y="34" font-size="12" fill="#8b949e">current streak</text>
  <text x="24" y="70" font-size="34" font-weight="700" fill="#e6edf3">1</text>
  <text x="50" y="70" font-size="13" fill="#8b949e">day</text>
  <text x="24" y="92" font-size="11" fill="#8b949e">Aug 11, 2026</text>

  <text x="252" y="34" font-size="12" fill="#8b949e">longest streak</text>
  <text x="252" y="70" font-size="34" font-weight="700" fill="#e6edf3">2</text>
  <text x="278" y="70" font-size="13" fill="#8b949e">days</text>
  <text x="252" y="92" font-size="11" fill="#8b949e">Aug 27 – Aug 28, 2025</text>
  <line x1="228" y1="20" x2="228" y2="100" stroke="#30363d" stroke-width="1"/>

